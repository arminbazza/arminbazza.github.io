    Experience:
      - company: University of Southern California
        position: Graduate Researcher
        location: Los Angeles, CA
        start_date: "2023-06"
        summary: "Supervisor: Dr. Payam Piray"
        highlights:
          - Extended the default representation, a predictive-representation RL model, to a fully feature-based formulation that preserves compositionality; proved convergence and showed improved task transfer over baselines (NeurIPS, 2026).
          - Developed an RL model of human decision-making that learns policy-independent predictive maps of the environment online, enabling flexible transfer across tasks. The model gives a single normative account of behavioral effects previously attributed to separate mechanisms and outperforms existing models in formal model comparison on human and rodent behavioral data (Nature Communications, 2026).
          - Proposed a theory of hippocampal replay as repair of the cognitive map that unifies a range of replay phenomena under a single mechanism; derived a novel prediction from the theory and confirmed it in neuronal replay recordings (manuscript in preparation).
          - Augmented EDELINE, a state-of-the-art diffusion-based world model, with an episodic memory buffer, showing that a simple memory component improves agent performance in environments that require long-term memory.
          - Used deep RL agents (model-based and model-free) as encoding models of brain activity, comparing how well each agent's internal representations predict neural responses across brain regions.

      - company: Honda Research Institute
        position: Research Engineer
        location: San Jose, CA
        url: https://usa.honda-ri.com
        start_date: "2021-12"
        end_date: "2023-03"
        summary: "Supervisor: Dr. Behzad Dariush"
        highlights:
          - Co-developed the first unified framework to jointly address trajectory prediction and imputation, introducing the benchmark and baselines for the problem (CVPR, 2023).
          - Developed models for road-scene classification and segmentation in an orthographic bird's-eye-view (BEV) frame, exploring temporal architectures that use long- and short-term context to handle occlusions.
          - Fine-tuned and deployed a real-time trajectory prediction model on vehicle hardware, optimizing the pre- and post-processing pipeline for latency and adapting inference to hardware constraints.

      - company: Center for Artificial Intelligence in Society (CAIS), USC
        position: Undergraduate Researcher
